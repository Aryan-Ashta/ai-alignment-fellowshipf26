[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stage2-whitebox"
version = "0.1.0"
description = "Stage 2 white-box pipeline: internal step depth on Olmo-3 Think"
requires-python = "==3.12.*"
dependencies = [
    "transformers==5.14.1",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "datasets==5.0.1",
    "pyarrow==25.0.0",
    "huggingface_hub==1.26.0",
    "torch==2.13.0",
    "accelerate==1.16.0",
    "safetensors==0.8.0",
    "matplotlib==3.11.2",
    "pytest==9.2.0",
    "tqdm==4.70.1",
    "pyyaml==6.0.4",
    "mlx==0.32.5",
    "mlx-lm==0.32.2",
    "jpp-lens",
]

[tool.uv.sources]
jpp-lens = { path = "third_party/jpp_lens", editable = false }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
